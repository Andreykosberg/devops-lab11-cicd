apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-psu
  labels:
    app: devops-psu
    release-date: s1793093395
  namespace: devops-psu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-psu
  template:
    metadata:
      labels:
        app: devops-psu
        svc: frontend
        release-date: s1793093395
    spec:
      containers:
        - name: devops-psu-server
          # NOTE: this is a manual bootstrap of the release branch, done because
          # release.yml (the real CD pipeline) cannot push to Docker Hub yet - the
          # repo is missing the DOCKER_USERNAME/DOCKER_TOKEN secrets. Per the lecture's
          # own fallback (slide 46), the image was built locally and loaded straight
          # into minikube with `minikube image load`, so ArgoCD can still perform a
          # real sync against this branch right now. Once the secrets are added and
          # release.yml succeeds, it force-pushes this branch with the real Docker Hub
          # image (andreykosberg/devops-psu:latest, imagePullPolicy Always) and ArgoCD's
          # self-heal picks it up automatically - see README.md.
          image: devops-psu:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: service-devops
  labels:
    app: devops-psu
  namespace: devops-psu
spec:
  type: LoadBalancer
  selector:
    app: devops-psu
    svc: frontend
  ports:
    - port: 12345
      targetPort: 8000
  externalIPs:
    - 10.0.2.15
